name: Alphabet Safari Unified Multi-Target CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # =========================================================================
  # 1. CODE, CONTENT & UNIFIED ASSET PARITY VALIDATION
  # =========================================================================
  validate-core:
    name: Core Web & Asset Parity Validation
    # Pinned: ubuntu-latest moves to Ubuntu 26 on 2026-10-19.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Lint Tooling
        run: npm ci --no-audit --no-fund

      - name: Lint JavaScript (catches undefined functions and variables)
        run: npm run lint

      - name: Validate JavaScript Syntax
        run: |
          node -c content.js
          node -c script.js
          node -c sw.js
          node -c android/app/src/main/assets/www/script.js

      - name: Validate JSON Manifests
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("manifest.json"))'
          node -e 'JSON.parse(require("fs").readFileSync("assets/audio/manifest.json"))'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify Asset Parity, Content and Recorded Audio
        run: python build.py --verify

  # =========================================================================
  # 1b. BROWSER SMOKE TEST (drives every mode in headless Chromium)
  # =========================================================================
  smoke-test:
    name: Browser Smoke Test
    runs-on: ubuntu-24.04
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Tooling and Chromium
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run Smoke Test
        run: npm run smoke

  # =========================================================================
  # 2. ANDROID NATIVE APK BUILD (AGP 9 / Gradle 9 / JDK 21)
  # =========================================================================
  build-android:
    name: Android Native APK Build
    runs-on: ubuntu-24.04
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      # Validates the committed gradle-wrapper.jar checksum and caches Gradle.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Android Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlphabetSafari-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. WINDOWS STANDALONE DESKTOP BUILD (PyInstaller + WebView2)
  # =========================================================================
  build-windows:
    name: Windows Standalone Desktop Build
    runs-on: windows-2025
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Desktop Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Standalone Windows Executable
        run: python build.py --windows

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v7
        with:
          name: AlphabetSafari-Windows-Desktop
          path: windows/dist/AlphabetSafari.exe
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 4. DOCKER WEB SERVER LIVE VERIFICATION
  # =========================================================================
  docker-test:
    name: Docker Web Server Live Verification
    runs-on: ubuntu-24.04
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build & Run Docker Container
        # --wait blocks until the compose healthcheck passes (no fixed sleep).
        run: docker compose up -d --build --wait

      # nginx falls back to index.html for unknown paths, so every check below asserts
      # the real content type or parses the body; a substring match could pass on the fallback.
      - name: Verify Web Application Endpoint
        run: |
          curl -fsS http://localhost:8085/ | grep -q "Alphabet Safari"
          curl -fsS http://localhost:8085/manifest.json | python3 -c 'import json,sys; assert json.load(sys.stdin)["short_name"]'
          curl -fsSI http://localhost:8085/content.js | grep -qi "content-type: application/javascript"
          curl -fsSI http://localhost:8085/assets/fonts/fonts.css | grep -qi "content-type: text/css"
          curl -fsSI http://localhost:8085/assets/audio/en/boy/A.mp3 | grep -qi "content-type: audio/mpeg"

      - name: Teardown Docker Stack
        if: always()
        run: docker compose down

  # =========================================================================
  # 5. DEPLOY TO GITHUB PAGES (only after the web checks pass, only from main)
  # =========================================================================
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: [validate-core, smoke-test, docker-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Publish only the web app, not android/, windows/, tools/, tests/ or build scripts.
      - name: Stage Web App
        run: python build.py --site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
