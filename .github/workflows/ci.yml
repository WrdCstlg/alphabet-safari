name: Alphabet Safari Unified Multi-Target CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CODE, MANIFEST & UNIFIED ASSET PARITY VALIDATION
  # =========================================================================
  validate-core:
    name: Core Web & Asset Parity Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript Syntax
        run: |
          node -c script.js
          node -c sw.js
          node -c android/app/src/main/assets/www/script.js

      - name: Validate JSON Manifest
        run: |
          node -e 'JSON.parse(require("fs").readFileSync("manifest.json"))'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify Unified Asset Parity
        run: |
          python build.py --verify

  # =========================================================================
  # 2. ANDROID NATIVE APK BUILD
  # =========================================================================
  build-android:
    name: Android Native APK Build
    runs-on: ubuntu-latest
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphabetSafari-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

  # =========================================================================
  # 3. WINDOWS STANDALONE DESKTOP BUILD (PyInstaller + WebView2)
  # =========================================================================
  build-windows:
    name: Windows Standalone Desktop Build
    runs-on: windows-latest
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Desktop Build Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pywebview Pillow

      - name: Compile Standalone Windows Executable
        run: |
          python build.py --windows

      - name: Upload Windows Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlphabetSafari-Windows-Desktop
          path: windows/dist/AlphabetSafari.exe
          retention-days: 14

  # =========================================================================
  # 4. DOCKER WEB SERVER LIVE VERIFICATION
  # =========================================================================
  docker-test:
    name: Docker Web Server Live Verification
    runs-on: ubuntu-latest
    needs: [validate-core]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Run Docker Container
        run: |
          docker compose build
          docker compose up -d
          sleep 4

      - name: Verify Web Application Endpoint
        run: |
          curl -f http://localhost:8085/ | grep -q "Alphabet Safari"
          curl -f http://localhost:8085/manifest.json | grep -q "Alphabet Safari"

      - name: Teardown Docker Stack
        if: always()
        run: |
          docker compose down
