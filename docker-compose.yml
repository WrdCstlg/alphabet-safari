services:
  alphabet-safari:
    build: .
    container_name: alphabet-safari-app
    restart: unless-stopped
    ports:
      - "8085:80"
    healthcheck:
      # 127.0.0.1, not localhost: on Alpine "localhost" resolves to ::1 first.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
      start_interval: 1s
